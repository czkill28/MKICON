<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Consumo de Bar</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#171310">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Consumo Bar">
<style>
:root{
  --bg:#171310; --bg2:#1f1a15; --card:#241e18;
  --line:#3a3128;
  --text:#F1E9DA; --muted:#A99C89;
  --amber:#D3941F; --amber-dim:#8a6420;
  --teal:#4F7A6E;
  --red:#B5503A;
  --radius:14px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;}
html,body{height:100%;margin:0;}
body{
  background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  display:flex; flex-direction:column; overflow:hidden;
}
header{padding:18px 18px 14px; border-bottom:1px solid var(--line); flex-shrink:0;}
header h1{font-size:1.05rem; margin:0 0 2px; font-weight:700; letter-spacing:.2px;}
header .sub{color:var(--muted); font-size:.82rem;}
main{flex:1; overflow-y:auto; padding:16px 16px 90px;}
nav{
  position:fixed; bottom:0; left:0; right:0;
  display:flex; background:var(--bg2); border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px); z-index:10;
}
nav button{
  flex:1; background:none; border:none; color:var(--muted);
  padding:12px 4px 10px; font-size:.72rem; display:flex; flex-direction:column;
  align-items:center; gap:4px; font-family:inherit;
}
nav button .ic{width:22px; height:22px; display:block;}
nav button .ic svg{width:100%; height:100%; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round;}
nav button.active{color:var(--amber);}
h2.section-title{font-size:.95rem; color:var(--amber); margin:0 0 12px; font-weight:700;}
h3.mini-title{font-size:.78rem; color:var(--muted); margin:16px 0 8px; text-transform:uppercase; letter-spacing:.4px;}
.card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:14px; margin-bottom:12px;}
.row{display:flex; gap:8px; align-items:center;}
input[type=text],input[type=date]{
  width:100%; background:var(--bg); border:1px solid var(--line); color:var(--text);
  padding:11px 12px; border-radius:10px; font-size:.95rem; font-family:inherit;
}
input:focus{outline:2px solid var(--amber); outline-offset:1px;}
label{font-size:.78rem; color:var(--muted); display:block; margin-bottom:5px;}
.field{margin-bottom:12px;}
button.btn{background:var(--amber); color:#221805; border:none; border-radius:10px; padding:11px 16px; font-weight:700; font-size:.9rem; font-family:inherit;}
button.btn.ghost{background:transparent; color:var(--amber); border:1px solid var(--amber-dim);}
button.btn:disabled{opacity:.4;}
.chip{padding:8px 14px; border-radius:999px; border:1px solid var(--line); background:var(--bg); color:var(--muted); font-size:.85rem; font-family:inherit; white-space:nowrap;}
.chip.active{background:var(--amber); color:#221805; border-color:var(--amber); font-weight:700;}
.chip.small{padding:6px 12px; font-size:.78rem;}
.chiprow{display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; margin-bottom:14px;}
.event-item{display:flex; justify-content:space-between; align-items:flex-start; padding:13px 0; border-bottom:1px solid var(--line); gap:10px; flex-wrap:wrap;}
.event-actions{flex-wrap:wrap; justify-content:flex-end; row-gap:6px;}
.event-item:last-child{border-bottom:none;}
.event-item .name{font-weight:600;}
.event-item .date{color:var(--muted); font-size:.78rem;}
.tag{font-size:.7rem; background:var(--teal); color:#0e1b17; padding:3px 8px; border-radius:6px; font-weight:700;}
.item-row{display:flex; align-items:center; justify-content:space-between; padding:11px 0; border-bottom:1px solid var(--line); gap:10px;}
.item-row:last-child{border-bottom:none;}
.item-row .iname{font-size:.95rem;}
.item-row .left{display:flex; align-items:center; gap:10px; flex:1; min-width:0;}
.item-row .left span{overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.stepper{display:flex; align-items:center; gap:10px;}
.stepper button{width:40px; height:40px; border-radius:10px; border:1px solid var(--line); background:var(--bg); color:var(--amber); font-size:1.2rem; font-family:inherit; display:flex; align-items:center; justify-content:center;}
.stepper button:active{background:var(--amber-dim);}
.stepper .qty{min-width:20px; text-align:center; font-weight:700;}
.empty{color:var(--muted); font-size:.85rem; text-align:center; padding:30px 10px;}
.iconbtn{background:none; border:none; color:var(--muted); font-size:1rem; padding:4px 8px; flex-shrink:0;}
.summary-group{margin-bottom:18px;}
.summary-group h3{font-size:.82rem; color:var(--teal); margin:0 0 8px;}
.summary-person{margin-bottom:10px;}
.summary-person .pname{font-weight:700; font-size:.88rem; margin-bottom:3px;}
.summary-person .pitem{color:var(--muted); font-size:.85rem; padding-left:8px;}
.totals{margin-top:20px; padding-top:14px; border-top:1px dashed var(--line);}
.totals .trow{display:flex; justify-content:space-between; font-size:.85rem; padding:4px 0;}
input[type=checkbox]{width:19px; height:19px; accent-color:var(--amber); flex-shrink:0;}
</style>
</head>
<body>
<header>
  <h1 id="hdrTitle">Consumo de Bar</h1>
  <div class="sub" id="hdrSub">Nenhum evento selecionado</div>
</header>
<main id="main"></main>
<nav>
  <button data-tab="eventos" class="active">
    <span class="ic"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg></span>
    Eventos
  </button>
  <button data-tab="itens">
    <span class="ic"><svg viewBox="0 0 24 24"><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line></svg></span>
    Itens
  </button>
  <button data-tab="registrar">
    <span class="ic"><svg viewBox="0 0 24 24"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg></span>
    Registrar
  </button>
  <button data-tab="resumo">
    <span class="ic"><svg viewBox="0 0 24 24"><path d="M9 2h6a1 1 0 0 1 1 1v2H8V3a1 1 0 0 1 1-1z"></path><rect x="4" y="4" width="16" height="18" rx="2"></rect><line x1="8" y1="11" x2="16" y2="11"></line><line x1="8" y1="15" x2="16" y2="15"></line></svg></span>
    Resumo
  </button>
</nav>

<script>
const KEY = 'consumo-bar-db-v2';
const OLD_KEY = 'consumo-bar-db-v1';
const CATS_DEFAULT = ['Equipe','Sócios','Avarias'];
const PRESETS_DEFAULT = {'Equipe':['Staffs','Segurança'], 'Sócios':[], 'Avarias':[]};

function uid(){ return Math.random().toString(36).slice(2,9); }
function sortByName(arr){ return arr.slice().sort((a,b)=> a.name.localeCompare(b.name, 'pt-BR', {sensitivity:'base'})); }
function groupItems(items){
  const groups = {};
  items.forEach(it=>{
    const g = (it.grupo||'').trim() || 'Sem grupo';
    if(!groups[g]) groups[g]=[];
    groups[g].push(it);
  });
  const names = Object.keys(groups).sort((a,b)=> a.localeCompare(b,'pt-BR',{sensitivity:'base'}));
  return names.map(g=>({grupo:g, items: sortByName(groups[g])}));
}

function freshDb(){ return {catalog:[], categoryCatalog:[...CATS_DEFAULT], categoryPresets: JSON.parse(JSON.stringify(PRESETS_DEFAULT)), events:[], activeId:null}; }

function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(raw) return migrate(JSON.parse(raw));
    const old = localStorage.getItem(OLD_KEY);
    if(old) return migrate(JSON.parse(old));
  }catch(e){}
  return freshDb();
}

// migrate old per-event item lists into a shared catalog + persistent categories/presets
function migrate(d){
  d.catalog = d.catalog || [];
  d.categoryPresets = d.categoryPresets || JSON.parse(JSON.stringify(PRESETS_DEFAULT));
  d.events = d.events || [];
  if(!d.categoryCatalog){
    const fromEvents = d.events.reduce((acc,ev)=> acc.concat(ev.categories||[]), []);
    const fromPresetKeys = Object.keys(d.categoryPresets);
    d.categoryCatalog = Array.from(new Set([...CATS_DEFAULT, ...fromEvents, ...fromPresetKeys]));
  }
  d.events.forEach(ev=>{
    if(ev.items && !ev.itemIds){
      const map = {};
      ev.items.forEach(it=>{
        let cat = d.catalog.find(c=>c.name.toLowerCase()===it.name.toLowerCase());
        if(!cat){ cat = {id:uid(), name:it.name}; d.catalog.push(cat); }
        map[it.id] = cat.id;
      });
      ev.itemIds = ev.items.map(it=>map[it.id]);
      ev.entries.forEach(en=>{ en.itemId = map[en.itemId] || en.itemId; });
      delete ev.items;
    }
    ev.itemIds = ev.itemIds || [];
    ev.knownPeople = ev.knownPeople || {};
    ev.entries.forEach(en=>{
      if(!ev.knownPeople[en.category]) ev.knownPeople[en.category] = [];
      if(!ev.knownPeople[en.category].includes(en.person)) ev.knownPeople[en.category].push(en.person);
    });
    ev.entries.forEach(en=>{ if(!d.categoryCatalog.includes(en.category)) d.categoryCatalog.push(en.category); });
    delete ev.categories;
  });
  return d;
}

function save(){ try{ localStorage.setItem(KEY, JSON.stringify(db)); }catch(e){} }
let db = load();
let tab = 'eventos';
let regCategory = 'Equipe';
let regPerson = '';
let configEventId = null;
let editingItemId = null;
let confirmDeleteItemId = null;
let confirmDeleteEventId = null;
let editingEventId = null;
let newEventItemIds = [];
let addingCategory = false;
let addingPreset = false;
let pendingImport = null;

function activeEvent(){ return db.events.find(e=>e.id===db.activeId) || null; }
function catalogItem(id){ return db.catalog.find(c=>c.id===id); }

function setTab(t){
  tab = t;
  editingItemId = null; confirmDeleteItemId = null; confirmDeleteEventId = null;
  editingEventId = null; newEventItemIds = [];
  addingCategory = false; addingPreset = false; pendingImport = null;
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active', b.dataset.tab===t));
  render();
}
document.querySelectorAll('nav button').forEach(b=>b.addEventListener('click',()=>setTab(b.dataset.tab)));

function renderHeader(){
  const ev = activeEvent();
  document.getElementById('hdrTitle').textContent = ev ? ev.name : 'Consumo de Bar';
  document.getElementById('hdrSub').textContent = ev ? (ev.date || 'Sem data') : 'Nenhum evento selecionado';
}

function render(){
  renderHeader();
  const m = document.getElementById('main');
  if(tab==='eventos') return renderEventos(m);
  if(tab==='itens') return renderItens(m);
  if(tab==='eventItems') return renderEventItems(m, configEventId);
  if(tab==='registrar') return renderRegistrar(m);
  if(tab==='resumo') return renderResumo(m);
}

async function getDownloadsCap(){
  try{
    if(!window.claude || !window.claude.use) return null;
    return await window.claude.use('downloads');
  }catch(e){ return null; }
}

/* ---------- EVENTOS ---------- */
function renderEventos(m){
  m.innerHTML = `
    <div class="card">
      <h2 class="section-title">Backup</h2>
      <div class="sub" style="color:var(--muted); font-size:.8rem; margin-bottom:12px;">Exporte tudo (eventos, itens, categorias e lançamentos) num arquivo. Se trocar de aparelho ou de navegador, importe esse arquivo lá para recuperar os dados.</div>
      <div class="row">
        <button class="btn" id="btnExport">Exportar backup</button>
        <button class="btn ghost" id="btnImportTrigger">Importar backup</button>
      </div>
      <input type="file" id="importFileInput" accept=".json,.txt,application/json,text/plain" style="display:none">
      <div id="backupBox" style="margin-top:10px;"></div>
      ${pendingImport ? `
        <div class="card" style="margin-top:12px; border-color:var(--amber);">
          <div style="margin-bottom:10px; font-size:.88rem;">Importar este backup vai <strong>substituir todos os dados atuais</strong> do app (eventos, itens, categorias, lançamentos). Deseja continuar?</div>
          <div class="row"><button class="btn" id="btnConfirmImport">Confirmar importação</button><button class="btn ghost" id="btnCancelImport">Cancelar</button></div>
        </div>` : ''}
    </div>
    <div class="card">
      <h2 class="section-title">Novo evento</h2>
      <div class="field"><label>Nome do evento</label><input type="text" id="newEvName" placeholder="Ex: Show Barão Vermelho"><div id="evNameWarn" style="display:none; color:var(--red); font-size:.78rem; margin-top:5px;">Dê um nome ao evento.</div></div>
      <div class="field"><label>Data</label><input type="date" id="newEvDate"></div>
      <h3 class="mini-title" style="margin-top:16px;">Itens deste evento</h3>
      <div class="sub" style="color:var(--muted); font-size:.8rem; margin-bottom:10px;">Marque, da base geral, o que vai estar disponível aqui. Dá pra ajustar depois também.</div>
      <div id="newEvItemList">${db.catalog.length? '' : '<div class="empty">Sua base geral está vazia. Cadastre itens na aba Itens primeiro.</div>'}</div>
      <button class="btn" id="btnAddEvent" style="margin-top:14px;">Criar evento</button>
    </div>
    <div class="card">
      <h2 class="section-title">Seus eventos</h2>
      <div id="evList">${db.events.length? '' : '<div class="empty">Nenhum evento cadastrado ainda.</div>'}</div>
    </div>
  `;

  document.getElementById('btnExport').addEventListener('click', exportBackup);
  document.getElementById('btnImportTrigger').addEventListener('click', ()=>{ document.getElementById('importFileInput').click(); });
  document.getElementById('importFileInput').addEventListener('change', handleImportFile);
  const confirmImportBtn = document.getElementById('btnConfirmImport');
  if(confirmImportBtn) confirmImportBtn.addEventListener('click', ()=>{
    db = migrate(pendingImport);
    pendingImport = null;
    save(); render();
  });
  const cancelImportBtn = document.getElementById('btnCancelImport');
  if(cancelImportBtn) cancelImportBtn.addEventListener('click', ()=>{ pendingImport = null; render(); });

  const newList = document.getElementById('newEvItemList');
  groupItems(db.catalog).forEach(g=>{
    const h = document.createElement('h3');
    h.className = 'mini-title';
    h.style.marginTop = '10px';
    h.textContent = g.grupo;
    newList.appendChild(h);
    g.items.forEach(it=>{
      const row = document.createElement('div');
      row.className = 'item-row';
      const checked = newEventItemIds.includes(it.id);
      row.innerHTML = `<div class="left"><input type="checkbox" data-newid="${it.id}" ${checked?'checked':''}><span>${escapeHtml(it.name)}</span></div>`;
      newList.appendChild(row);
    });
  });
  newList.querySelectorAll('[data-newid]').forEach(cb=>cb.addEventListener('change',()=>{
    const id = cb.dataset.newid;
    if(cb.checked){ if(!newEventItemIds.includes(id)) newEventItemIds.push(id); }
    else{ newEventItemIds = newEventItemIds.filter(i=>i!==id); }
  }));

  const list = document.getElementById('evList');
  db.events.slice().reverse().forEach(e=>{
    const row = document.createElement('div');
    row.className = 'event-item';
    if(confirmDeleteEventId === e.id){
      row.innerHTML = `
        <div><span style="color:var(--red);">Excluir "${escapeHtml(e.name)}" e todos os dados dele?</span></div>
        <div class="row event-actions">
          <button class="iconbtn" data-confirmdelev="${e.id}" style="color:var(--red);">Confirmar</button>
          <button class="iconbtn" data-canceldelev="${e.id}">Cancelar</button>
        </div>`;
    } else if(editingEventId === e.id){
      row.innerHTML = `
        <div style="width:100%;">
          <div class="field"><label>Nome</label><input type="text" id="editEvName_${e.id}" value="${escapeHtml(e.name)}"></div>
          <div class="field"><label>Data</label><input type="date" id="editEvDate_${e.id}" value="${e.date||''}"></div>
          <div class="row"><button class="btn" data-saveev="${e.id}">Salvar</button><button class="btn ghost" data-cancelev="${e.id}">Cancelar</button></div>
        </div>`;
    } else {
      row.innerHTML = `
        <div>
          <div class="name">${escapeHtml(e.name)} ${e.id===db.activeId?'<span class="tag">ativo</span>':''}</div>
          <div class="date">${e.date||'sem data'} · ${e.itemIds.length} itens · ${e.entries.length} lançamentos</div>
        </div>
        <div class="row event-actions">
          <button class="iconbtn" data-act="edit" data-id="${e.id}">✏️</button>
          <button class="iconbtn" data-act="items" data-id="${e.id}">🧾 Itens</button>
          <button class="iconbtn" data-act="dup" data-id="${e.id}">📄 Duplicar</button>
          <button class="iconbtn" data-act="use" data-id="${e.id}">Usar</button>
          <button class="iconbtn" data-act="del" data-id="${e.id}">🗑️</button>
        </div>`;
    }
    list.appendChild(row);
  });
  list.querySelectorAll('[data-act=items]').forEach(b=>b.addEventListener('click',()=>{
    configEventId = b.dataset.id; tab = 'eventItems'; render();
  }));
  list.querySelectorAll('[data-act=use]').forEach(b=>b.addEventListener('click',()=>{db.activeId=b.dataset.id; save(); setTab('registrar');}));
  list.querySelectorAll('[data-act=edit]').forEach(b=>b.addEventListener('click',()=>{
    editingEventId = b.dataset.id; confirmDeleteEventId = null; render();
  }));
  list.querySelectorAll('[data-cancelev]').forEach(b=>b.addEventListener('click',()=>{
    editingEventId = null; render();
  }));
  list.querySelectorAll('[data-saveev]').forEach(b=>b.addEventListener('click',()=>{
    const id = b.dataset.saveev;
    const ev = db.events.find(x=>x.id===id);
    const nameInp = document.getElementById('editEvName_'+id);
    const dateInp = document.getElementById('editEvDate_'+id);
    const newName = nameInp.value.trim();
    if(!newName){ nameInp.focus(); return; }
    ev.name = newName; ev.date = dateInp.value;
    editingEventId = null; save(); render();
  }));
  list.querySelectorAll('[data-act=dup]').forEach(b=>b.addEventListener('click',()=>{
    const src = db.events.find(x=>x.id===b.dataset.id);
    if(!src) return;
    const novo = {id:uid(), name: src.name + ' (cópia)', date:'', itemIds:[...src.itemIds], entries:[]};
    db.events.push(novo);
    editingEventId = novo.id;
    save(); render();
  }));
  list.querySelectorAll('[data-act=del]').forEach(b=>b.addEventListener('click',()=>{
    confirmDeleteEventId = b.dataset.id; editingEventId = null; render();
  }));
  list.querySelectorAll('[data-canceldelev]').forEach(b=>b.addEventListener('click',()=>{
    confirmDeleteEventId = null; render();
  }));
  list.querySelectorAll('[data-confirmdelev]').forEach(b=>b.addEventListener('click',()=>{
    const id = b.dataset.confirmdelev;
    db.events = db.events.filter(e=>e.id!==id);
    if(db.activeId===id) db.activeId = null;
    confirmDeleteEventId = null; save(); render();
  }));
  document.getElementById('btnAddEvent').addEventListener('click',()=>{
    const nameInp = document.getElementById('newEvName');
    const name = nameInp.value.trim();
    const warn = document.getElementById('evNameWarn');
    if(!name){ if(warn) warn.style.display='block'; nameInp.focus(); return; }
    const date = document.getElementById('newEvDate').value;
    const e = {id:uid(), name, date, itemIds:[...newEventItemIds], entries:[]};
    db.events.push(e); db.activeId = e.id; newEventItemIds = []; save(); render();
  });
}

/* ---------- ITENS (base geral, independente de evento) ---------- */
function renderItens(m){
  m.innerHTML = `
    <div class="card">
      <h2 class="section-title">Base geral de itens</h2>
      <div class="sub" style="color:var(--muted); font-size:.8rem; margin-bottom:12px;">Esta lista é única e não depende de nenhum evento. Para escolher os itens de um evento específico, use o botão "Itens" na aba Eventos.</div>
      <div class="row">
        <input type="text" id="newItemName" placeholder="Ex: Água com gás">
      </div>
      <div class="field" style="margin-top:8px;">
        <input type="text" id="newItemGroup" list="groupList" placeholder="Grupo (ex: Cervejas/Chopp)">
        <datalist id="groupList"></datalist>
      </div>
      <button class="btn" id="btnAddItem">Adicionar</button>
      <div id="catalogList" style="margin-top:14px;">${db.catalog.length? '' : '<div class="empty">Nenhum item na base ainda.</div>'}</div>
    </div>
  `;
  const groupList = document.getElementById('groupList');
  Array.from(new Set(db.catalog.map(it=>(it.grupo||'').trim()).filter(Boolean))).sort().forEach(g=>{
    const o = document.createElement('option'); o.value = g; groupList.appendChild(o);
  });
  const list = document.getElementById('catalogList');
  groupItems(db.catalog).forEach(g=>{
    const h = document.createElement('h3');
    h.className = 'mini-title';
    h.textContent = g.grupo;
    list.appendChild(h);
    g.items.forEach(it=>{
      const row = document.createElement('div');
      if(editingItemId === it.id){
        row.className = 'card';
        row.style.marginBottom = '8px';
        row.innerHTML = `
          <div class="field"><label>Nome</label><input type="text" id="editName_${it.id}" value="${escapeHtml(it.name)}"></div>
          <div class="field"><label>Grupo</label><input type="text" id="editGroup_${it.id}" value="${escapeHtml(it.grupo||'')}" list="groupList"></div>
          <div class="row">
            <button class="btn" data-save="${it.id}">Salvar</button>
            <button class="btn ghost" data-cancel-edit="${it.id}">Cancelar</button>
          </div>`;
      } else if(confirmDeleteItemId === it.id){
        row.className = 'item-row';
        row.innerHTML = `
          <span class="iname" style="color:var(--red);">Excluir "${escapeHtml(it.name)}"?</span>
          <div class="row">
            <button class="iconbtn" data-confirmdel="${it.id}" style="color:var(--red);">Confirmar</button>
            <button class="iconbtn" data-canceldel="${it.id}">Cancelar</button>
          </div>`;
      } else {
        row.className = 'item-row';
        row.innerHTML = `
          <div class="left"><span>${escapeHtml(it.name)}</span></div>
          <div class="row">
            <button class="iconbtn" data-edit="${it.id}">✏️</button>
            <button class="iconbtn" data-del="${it.id}">🗑️</button>
          </div>`;
      }
      list.appendChild(row);
    });
  });
  list.querySelectorAll('[data-edit]').forEach(b=>b.addEventListener('click',()=>{
    editingItemId = b.dataset.edit; confirmDeleteItemId = null; render();
  }));
  list.querySelectorAll('[data-cancel-edit]').forEach(b=>b.addEventListener('click',()=>{
    editingItemId = null; render();
  }));
  list.querySelectorAll('[data-save]').forEach(b=>b.addEventListener('click',()=>{
    const id = b.dataset.save;
    const it = db.catalog.find(c=>c.id===id);
    const nameInp = document.getElementById('editName_'+id);
    const groupInp = document.getElementById('editGroup_'+id);
    const newName = nameInp.value.trim();
    if(!newName){ nameInp.focus(); return; }
    it.name = newName; it.grupo = groupInp.value.trim();
    editingItemId = null; save(); render();
  }));
  list.querySelectorAll('[data-del]').forEach(b=>b.addEventListener('click',()=>{
    confirmDeleteItemId = b.dataset.del; editingItemId = null; render();
  }));
  list.querySelectorAll('[data-canceldel]').forEach(b=>b.addEventListener('click',()=>{
    confirmDeleteItemId = null; render();
  }));
  list.querySelectorAll('[data-confirmdel]').forEach(b=>b.addEventListener('click',()=>{
    const id = b.dataset.confirmdel;
    db.catalog = db.catalog.filter(c=>c.id!==id);
    db.events.forEach(e=>{ e.itemIds = e.itemIds.filter(i=>i!==id); });
    confirmDeleteItemId = null; save(); render();
  }));
  document.getElementById('btnAddItem').addEventListener('click', addItem);
  document.getElementById('newItemName').addEventListener('keydown', e=>{ if(e.key==='Enter') document.getElementById('newItemGroup').focus(); });
  document.getElementById('newItemGroup').addEventListener('keydown', e=>{ if(e.key==='Enter') addItem(); });
  function addItem(){
    const nameInp = document.getElementById('newItemName');
    const groupInp = document.getElementById('newItemGroup');
    const name = nameInp.value.trim();
    if(!name) return;
    const grupo = groupInp.value.trim();
    db.catalog.push({id:uid(), name, grupo});
    save(); render();
    setTimeout(()=>document.getElementById('newItemName').focus(),0);
  }
}

/* ---------- ITENS DO EVENTO (seleção contextual, a partir de Eventos) ---------- */
function renderEventItems(m, eventId){
  const ev = db.events.find(e=>e.id===eventId);
  if(!ev){ tab='eventos'; return render(); }
  m.innerHTML = `
    <button class="btn ghost" id="btnBackEv" style="margin-bottom:14px;">← Voltar para eventos</button>
    <div class="card">
      <h2 class="section-title">Itens de "${escapeHtml(ev.name)}"</h2>
      <div class="sub" style="color:var(--muted); font-size:.8rem; margin-bottom:12px;">Marque quais itens da base geral vão estar disponíveis neste evento.</div>
      <div id="evItemList">${db.catalog.length? '' : '<div class="empty">Sua base geral está vazia. Vá na aba Itens e cadastre algo primeiro.</div>'}</div>
    </div>`;
  document.getElementById('btnBackEv').addEventListener('click', ()=>{ tab='eventos'; render(); });
  const list = document.getElementById('evItemList');
  groupItems(db.catalog).forEach(g=>{
    const h = document.createElement('h3');
    h.className = 'mini-title';
    h.textContent = g.grupo;
    list.appendChild(h);
    g.items.forEach(it=>{
      const row = document.createElement('div');
      row.className = 'item-row';
      const checked = ev.itemIds.includes(it.id);
      row.innerHTML = `<div class="left"><input type="checkbox" data-id="${it.id}" ${checked?'checked':''}><span>${escapeHtml(it.name)}</span></div>`;
      list.appendChild(row);
    });
  });
  list.querySelectorAll('input[type=checkbox]').forEach(cb=>cb.addEventListener('change',()=>{
    const id = cb.dataset.id;
    if(cb.checked){ if(!ev.itemIds.includes(id)) ev.itemIds.push(id); }
    else{ ev.itemIds = ev.itemIds.filter(i=>i!==id); }
    save();
  }));
}

/* ---------- REGISTRAR ---------- */
function findEntry(ev, category, person, itemId){
  return ev.entries.find(en=>en.category===category && en.person===person && en.itemId===itemId);
}
function changeQty(ev, category, person, itemId, delta){
  let en = findEntry(ev, category, person, itemId);
  if(!en){
    if(delta<=0) return;
    en = {id:uid(), category, person, itemId, qty:0};
    ev.entries.push(en);
  }
  en.qty += delta;
  if(en.qty<=0) ev.entries = ev.entries.filter(e=>e!==en);
  if(delta>0){
    if(!ev.knownPeople) ev.knownPeople = {};
    if(!ev.knownPeople[category]) ev.knownPeople[category] = [];
    if(!ev.knownPeople[category].includes(person)) ev.knownPeople[category].push(person);
  }
  save();
}

function renderRegistrar(m){
  const ev = activeEvent();
  if(!ev){ m.innerHTML = '<div class="empty">Selecione ou crie um evento primeiro, na aba Eventos.</div>'; return; }
  if(!ev.itemIds.length){ m.innerHTML = '<div class="empty">Marque os itens disponíveis na aba Itens antes de registrar.</div>'; return; }
  if(!db.categoryCatalog.includes(regCategory)) regCategory = db.categoryCatalog[0];

  const isAvaria = regCategory === 'Avarias';
  const presets = db.categoryPresets[regCategory] || [];

  m.innerHTML = `
    <div class="chiprow" id="catRow"></div>
    <div id="addCategoryBox"></div>
    ${isAvaria ? '' : `
    <div class="field">
      <label>Para quem</label>
      <input type="text" id="personInput" placeholder="Nome (ex: Rudy, Rony...)" value="${escapeHtml(regPerson)}">
    </div>
    <h3 class="mini-title" style="margin-top:2px;">Toque para selecionar</h3>
    <div class="chiprow" id="presetRow"></div>
    <div id="addPresetBox"></div>`}
    <div class="card"><div id="itemStepList"></div></div>
  `;

  const catRow = document.getElementById('catRow');
  db.categoryCatalog.forEach(c=>{
    const chip = document.createElement('button');
    chip.className = 'chip' + (c===regCategory?' active':'');
    chip.textContent = c;
    chip.addEventListener('click', ()=>{ regCategory=c; regPerson = c==='Avarias' ? 'Avaria' : ''; addingCategory=false; render(); });
    catRow.appendChild(chip);
  });
  const addCat = document.createElement('button');
  addCat.className = 'chip';
  addCat.textContent = '+ nova categoria';
  addCat.addEventListener('click', ()=>{ addingCategory = true; render(); });
  catRow.appendChild(addCat);

  const addCategoryBox = document.getElementById('addCategoryBox');
  if(addingCategory){
    addCategoryBox.innerHTML = `
      <div class="card" style="margin-top:0;">
        <div class="field"><label>Nome da nova categoria</label><input type="text" id="newCatInput" placeholder="Ex: Fornecedores, VIP..."></div>
        <div class="row"><button class="btn" id="btnSaveCat">Adicionar</button><button class="btn ghost" id="btnCancelCat">Cancelar</button></div>
      </div>`;
    const inp = document.getElementById('newCatInput');
    setTimeout(()=>inp.focus(),0);
    const commit = ()=>{
      const c = inp.value.trim();
      if(!c) return;
      if(!db.categoryCatalog.includes(c)) db.categoryCatalog.push(c);
      if(!db.categoryPresets[c]) db.categoryPresets[c] = [];
      regCategory = c; regPerson=''; addingCategory=false;
      save(); render();
    };
    inp.addEventListener('keydown', e=>{ if(e.key==='Enter') commit(); });
    document.getElementById('btnSaveCat').addEventListener('click', commit);
    document.getElementById('btnCancelCat').addEventListener('click', ()=>{ addingCategory=false; render(); });
  }

  if(!isAvaria){
    const usedNames = (ev.knownPeople && ev.knownPeople[regCategory]) ? ev.knownPeople[regCategory].slice() : [];
    const suggestions = Array.from(new Set([...presets, ...usedNames])).sort((a,b)=>a.localeCompare(b,'pt-BR',{sensitivity:'base'}));
    const pInput = document.getElementById('personInput');
    pInput.addEventListener('input', ()=>{ regPerson = pInput.value; renderStepList(); highlightChips(); });

    const presetRow = document.getElementById('presetRow');
    function highlightChips(){
      presetRow.querySelectorAll('[data-chipname]').forEach(c=>{
        c.classList.toggle('active', c.dataset.chipname === regPerson);
      });
    }
    if(!suggestions.length){
      const hint = document.createElement('div');
      hint.className = 'empty';
      hint.style.padding = '6px 2px';
      hint.textContent = 'Ninguém ainda — digite um nome acima e lance um item para ele aparecer aqui.';
      presetRow.appendChild(hint);
    }
    suggestions.forEach(p=>{
      const chip = document.createElement('button');
      chip.className = 'chip small' + (regPerson===p?' active':'');
      chip.dataset.chipname = p;
      chip.textContent = p;
      chip.addEventListener('click', ()=>{ regPerson=p; pInput.value=p; addingPreset=false; renderStepList(); highlightChips(); });
      presetRow.appendChild(chip);
    });
    const addPreset = document.createElement('button');
    addPreset.className = 'chip small';
    addPreset.textContent = '+ sugestão fixa';
    addPreset.addEventListener('click', ()=>{ addingPreset = true; render(); });
    presetRow.appendChild(addPreset);

    const addPresetBox = document.getElementById('addPresetBox');
    if(addingPreset){
      addPresetBox.innerHTML = `
        <div class="card" style="margin-top:0;">
          <div class="field"><label>Sugestão fixa para "${escapeHtml(regCategory)}"</label><input type="text" id="newPresetInput" placeholder="Ex: Staffs"></div>
          <div class="row"><button class="btn" id="btnSavePreset">Adicionar</button><button class="btn ghost" id="btnCancelPreset">Cancelar</button></div>
        </div>`;
      const inp = document.getElementById('newPresetInput');
      setTimeout(()=>inp.focus(),0);
      const commit = ()=>{
        const p = inp.value.trim();
        if(!p) return;
        if(!db.categoryPresets[regCategory]) db.categoryPresets[regCategory] = [];
        if(!db.categoryPresets[regCategory].includes(p)) db.categoryPresets[regCategory].push(p);
        regPerson = p; addingPreset=false;
        save(); render();
      };
      inp.addEventListener('keydown', e=>{ if(e.key==='Enter') commit(); });
      document.getElementById('btnSavePreset').addEventListener('click', commit);
      document.getElementById('btnCancelPreset').addEventListener('click', ()=>{ addingPreset=false; render(); });
    }
  } else {
    regPerson = 'Avaria';
  }

  renderStepList();

  function renderStepList(){
    const list = document.getElementById('itemStepList');
    const person = isAvaria ? 'Avaria' : (regPerson||'').trim();
    list.innerHTML = '';
    if(!isAvaria && !person){
      list.innerHTML = '<div class="empty">Digite ou toque o nome de quem recebeu para começar a lançar.</div>';
      return;
    }
    const catalogForEvent = ev.itemIds.map(id=>catalogItem(id)).filter(Boolean);
    groupItems(catalogForEvent).forEach(g=>{
      const h = document.createElement('h3');
      h.className = 'mini-title';
      h.textContent = g.grupo;
      list.appendChild(h);
      g.items.forEach(it=>{
        const en = findEntry(ev, regCategory, person, it.id);
        const qty = en ? en.qty : 0;
        const row = document.createElement('div');
        row.className = 'item-row';
        row.innerHTML = `
          <span class="iname">${escapeHtml(it.name)}</span>
          <div class="stepper">
            <button data-d="-1">−</button>
            <span class="qty">${qty}</span>
            <button data-d="1">+</button>
          </div>`;
        row.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{
          const hadPerson = ev.knownPeople && ev.knownPeople[regCategory] && ev.knownPeople[regCategory].includes(person);
          changeQty(ev, regCategory, person, it.id, parseInt(b.dataset.d));
          if(!hadPerson) render(); else renderStepList();
        }));
        list.appendChild(row);
      });
    });
  }
}

/* ---------- RESUMO ---------- */
function renderResumo(m){
  const ev = activeEvent();
  if(!ev){ m.innerHTML = '<div class="empty">Selecione ou crie um evento primeiro, na aba Eventos.</div>'; return; }
  if(!ev.entries.length){ m.innerHTML = '<div class="empty">Nenhum lançamento ainda neste evento.</div>'; return; }

  const itemName = id => (catalogItem(id)||{}).name || '(item removido)';
  const cats = Array.from(new Set(ev.entries.map(e=>e.category)));

  let html = '';
  cats.forEach(cat=>{
    const entries = ev.entries.filter(e=>e.category===cat);
    const people = Array.from(new Set(entries.map(e=>e.person)));
    html += `<div class="summary-group"><h3>${escapeHtml(cat)}</h3>`;
    people.forEach(p=>{
      const pe = entries.filter(e=>e.person===p);
      html += `<div class="summary-person"><div class="pname">${escapeHtml(p)}</div>`;
      pe.forEach(e=> html += `<div class="pitem">${e.qty} — ${escapeHtml(itemName(e.itemId))}</div>`);
      html += `</div>`;
    });
    html += `</div>`;
  });

  const totalsByItem = {};
  ev.entries.forEach(e=>{ totalsByItem[e.itemId] = (totalsByItem[e.itemId]||0) + e.qty; });
  const totalItems = Object.keys(totalsByItem).map(id=> catalogItem(id) || {id, name:'(item removido)', grupo:''}).filter((v,i,a)=>a.findIndex(x=>x.id===v.id)===i);
  html += `<div class="totals"><h3 style="color:var(--amber);font-size:.85rem;margin-bottom:8px;">Total geral por item</h3>`;
  groupItems(totalItems).forEach(g=>{
    html += `<div style="color:var(--muted); font-size:.72rem; text-transform:uppercase; letter-spacing:.4px; margin:10px 0 4px;">${escapeHtml(g.grupo)}</div>`;
    g.items.forEach(it=>{
      html += `<div class="trow"><span>${escapeHtml(it.name)}</span><span>${totalsByItem[it.id]}</span></div>`;
    });
  });
  html += `</div><div style="margin-top:18px;"><button class="btn ghost" id="btnCopy">Copiar resumo em texto</button></div><div id="copyBox"></div>`;

  m.innerHTML = html;
  document.getElementById('btnCopy').addEventListener('click', ()=>{
    let txt = `${ev.name}${ev.date? ' - '+ev.date : ''}\n\n`;
    cats.forEach(cat=>{
      const entries = ev.entries.filter(e=>e.category===cat);
      const people = Array.from(new Set(entries.map(e=>e.person)));
      txt += `${cat}\n`;
      people.forEach(p=>{
        if(cat!=='Avarias') txt += `${p}\n`;
        ev.entries.filter(e=>e.category===cat && e.person===p).forEach(e=>{
          txt += `${e.qty} - ${itemName(e.itemId)}\n`;
        });
        txt += `\n`;
      });
    });
    const btn = document.getElementById('btnCopy');
    const box = document.getElementById('copyBox');
    const showFallback = ()=>{
      box.innerHTML = `<div class="field" style="margin-top:10px;"><label>Não deu pra copiar automaticamente — selecione e copie manualmente:</label><textarea readonly style="width:100%; min-height:140px; background:var(--bg); border:1px solid var(--line); color:var(--text); border-radius:10px; padding:10px; font-family:inherit; font-size:.85rem;">${escapeHtml(txt)}</textarea></div>`;
      const ta = box.querySelector('textarea');
      ta.focus(); ta.select();
    };
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(()=>{
        box.innerHTML = '';
        const old = btn.textContent; btn.textContent = 'Copiado!';
        setTimeout(()=>{ btn.textContent = old; }, 1800);
      }).catch(showFallback);
    } else {
      showFallback();
    }
  });
}

async function exportBackup(){
  const filename = 'consumo-bar-backup-' + new Date().toISOString().slice(0,10) + '.json';
  const data = JSON.stringify(db, null, 2);
  const box = document.getElementById('backupBox');
  box.innerHTML = '<div class="sub" style="color:var(--muted); font-size:.8rem;">Preparando arquivo...</div>';

  // 1) capacidade de download da plataforma
  const cap = await getDownloadsCap();
  if(cap){
    try{
      await cap.save({filename, data});
      box.innerHTML = '<div class="sub" style="color:var(--teal); font-size:.8rem;">Backup salvo com sucesso!</div>';
      return;
    }catch(e){ /* segue pro próximo método */ }
  }

  // 2) link de download padrão do navegador (funciona bem em site hospedado de verdade)
  try{
    const blob = new Blob([data], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 2000);
    box.innerHTML = '<div class="sub" style="color:var(--teal); font-size:.8rem;">Download iniciado! Confira a pasta Downloads do celular.</div>';
    return;
  }catch(e){ /* segue pro próximo método */ }

  // 3) compartilhamento nativo do celular (Salvar em Arquivos, WhatsApp, Drive, e-mail...)
  try{
    const file = new File([data], filename, {type:'application/json'});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file], title:'Backup Consumo de Bar'});
      box.innerHTML = '<div class="sub" style="color:var(--teal); font-size:.8rem;">Backup compartilhado!</div>';
      return;
    }
  }catch(e){
    if(e && e.name === 'AbortError'){ box.innerHTML = ''; return; } // usuário cancelou o compartilhamento
  }

  // 4) copiar para a área de transferência (com fallback de seleção manual)
  box.innerHTML = `<div class="field"><label>Não deu pra salvar ou compartilhar automaticamente. Copie o backup:</label>
    <div class="row" style="margin:8px 0;"><button class="btn ghost" id="btnCopyBackup">Copiar backup</button></div>
    <textarea readonly style="width:100%; min-height:160px; background:var(--bg); border:1px solid var(--line); color:var(--text); border-radius:10px; padding:10px; font-family:inherit; font-size:.78rem;">${escapeHtml(data)}</textarea></div>`;
  const btnCopy = document.getElementById('btnCopyBackup');
  const ta = box.querySelector('textarea');
  btnCopy.addEventListener('click', ()=>{
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(data).then(()=>{
        const old = btnCopy.textContent; btnCopy.textContent = 'Copiado!';
        setTimeout(()=>{ btnCopy.textContent = old; }, 1800);
      }).catch(()=>{ ta.focus(); ta.select(); });
    } else { ta.focus(); ta.select(); }
  });
}

function handleImportFile(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const parsed = JSON.parse(reader.result);
      if(!parsed || !Array.isArray(parsed.events) || !Array.isArray(parsed.catalog)){
        throw new Error('formato inválido');
      }
      pendingImport = parsed;
      render();
    }catch(err){
      pendingImport = null;
      const box = document.getElementById('backupBox');
      if(box) box.innerHTML = '<div class="sub" style="color:var(--red); font-size:.8rem;">Arquivo inválido. Confira se é um backup exportado por este mesmo app.</div>';
    }
  };
  reader.readAsText(file);
  e.target.value = '';
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

if(db.activeId && activeEvent()) tab='registrar';
else if(!db.events.length) tab='itens';
else tab='eventos';
document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active', b.dataset.tab===tab));
render();
</script>
